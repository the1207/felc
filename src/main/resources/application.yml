spring:
  application:
    name: felc-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        # Pooler (pgbouncer / Supabase) : pas de prepared statements cote serveur
        prepareThreshold: 0
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  jwt:
    # Au moins 32 caractères (HS256). À définir dans les variables d'environnement.
    secret: ${JWT_SECRET}
    expiration-ms: 86400000   # 24 h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://felc-front.felc.workers.dev,https://felcfront.felc.workers.dev,https://felc-front-production.up.railway.app}
  ai:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
    seuil-validation: 70
  github:
    token: ${GITHUB_TOKEN:}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
